[build-system]
requires = ["setuptools>=75", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "metrit"
dynamic = ["version"]
description = "A dead simple resource monitoring decorator"
authors = [{name = "Mario Crespo", email = "info@mariocrespo.es"}]
readme = "README.md"
dependencies = ["psutil>=6.0.0", "multiprocess>=0.70.17"]
requires-python = ">= 3.11"

license = {file = "LICENSE"}
classifiers = [
        "Development Status :: 5 - Production/Stable",
        "Programming Language :: Python :: 3",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: 3.14",
        "License :: OSI Approved :: MIT License",
        "Operating System :: OS Independent",
        "Intended Audience :: Developers",
    ]

[project.urls]
Repository = "https://github.com/mcrespoae/metrit"


[dependency-groups]
dev = [
    "setuptools-scm>=8.1",
    "wheel>=0.44",
    "twine>=5.1",
    "build>=1.2",
    "flake8",
    "basedpyright",
    "coverage>=7.6",
]


[tool.setuptools.package-data]
metrit = ["py.typed"]


[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.pyright]
include = ["metrit"]
exclude = [".venv", "build", "dist", "metrit.egg-info", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
