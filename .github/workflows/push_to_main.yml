# This workflow will install Python dependencies, run tests and lint with uv
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python push to main - Run test and lint

on:
  push:
    branches: [ "main" ]
    # Run for every change that can affect the build. Previously only `metrit/**.py`
    # was listed, so test- or config-only changes silently skipped CI.
    paths:
      - "metrit/**"
      - "tests/**"
      - "examples/**"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".flake8"
  pull_request:
    branches: [ "main" ]
    paths:
      - "metrit/**"
      - "tests/**"
      - "examples/**"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".flake8"

jobs:
    build:
      runs-on: ubuntu-latest
      strategy:
        fail-fast: false
        matrix:
          python-version: [ "3.11", "3.12", "3.13", "3.14" ]
      steps:
        - name: Checkout repository
          uses: actions/checkout@v7

        - name: Install uv
          uses: astral-sh/setup-uv@v10.3.0
          with:
            python-version: ${{ matrix.python-version }}
            enable-cache: true

        - name: Install dependencies
          run: uv sync --dev

        - name: flake8 Lint
          run: uv run flake8

        - name: basedpyright Type Check
          run: uv run basedpyright

        - name: Run unittests
          run: uv run python -m unittest discover -v -s ./tests -p "*test*.py"
