# This workflow will install Python dependencies, run tests and lint with uv
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python push to main - Run test and lint

on:
  push:
    branches: [ "main" ]
    paths: metrit/**.py
  pull_request:
    branches: [ "main" ]
    paths: metrit/**.py

jobs:
    build:
      runs-on: ubuntu-latest
      strategy:
        fail-fast: false
        matrix:
          python-version: [ "3.11", "3.12", "3.13", "3.14" ]
      steps:
        - name: Checkout repository
          uses: actions/checkout@v7

        - name: Install uv
          uses: astral-sh/setup-uv@v10.3.0
          with:
            python-version: ${{ matrix.python-version }}
            enable-cache: true

        - name: Install dependencies
          run: uv sync --dev

        - name: flake8 Lint
          run: >
            uv run flake8
            --max-line-length=350
            --extend-ignore=F401,E402,E302,E305,E265,E701,F824
            --extend-exclude=.venv,examples/examples.py
            .

        - name: Run unittests
          run: uv run python -m unittest discover -v -s ./tests -p "*test*.py"
